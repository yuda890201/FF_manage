name: UI Tests

# index.html を変更したときに、画面の動作が壊れていないか自動で確認する。
# 実際の運用端末である12.3インチタブレット相当の画面サイズで検証している。
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/ui-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npx playwright test

      # 失敗したときだけ、失敗時のスクリーンショットとトレースを残す
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
